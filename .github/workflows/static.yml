<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary ❤️</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    position:relative;
}

.container{
    text-align:center;
    padding:30px;
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:25px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    color:white;
    z-index:2;
}

h1{
    font-size:2.2rem;
    margin-bottom:15px;
    animation:glow 2s infinite alternate;
}

.message{
    font-size:1.1rem;
    line-height:1.8;
    margin-bottom:25px;
}

.names{
    font-size:1.5rem;
    font-weight:700;
    color:#fff;
    margin:15px 0;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 25px #ff1744;
    }
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:rgba(255,255,255,0.7);
    font-size:20px;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-100px) scale(1.5);
        opacity:0;
    }
}

/* Mobile */
@media(max-width:480px){
    h1{
        font-size:1.8rem;
    }

    .message{
        font-size:1rem;
    }

    .names{
        font-size:1.2rem;
    }
}
</style>
</head>

<body>

<!-- Floating Hearts -->
<div id="hearts"></div>

<div class="container">
    <h1>❤️ Happy Anniversary ❤️</h1>

    <div class="names">
        Jayanth ❤️ Nainitha
    </div>

    <p class="message">
        Every love story is beautiful, but ours is my favorite. 💕<br><br>
        Thank you for filling every day with love, laughter, and unforgettable memories.
        May our journey together continue forever.
    </p>

    <button onclick="celebrate()">🎉 Celebrate 🎉</button>
</div>

<script>
// Confetti Burst
function celebrate(){

    var duration = 5000;
    var end = Date.now() + duration;

    (function frame(){
        confetti({
            particleCount:5,
            angle:60,
            spread:55,
            origin:{x:0}
        });

        confetti({
            particleCount:5,
            angle:120,
            spread:55,
            origin:{x:1}
        });

        if(Date.now() < end){
            requestAnimationFrame(frame);
        }
    }());
}

// Auto Confetti on Load
window.onload = () => {
    celebrate();
};

// Floating Hearts Generator
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*25) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,400);
</script>

</body>
</html>
