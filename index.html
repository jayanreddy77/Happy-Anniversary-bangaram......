<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary, Nainitha Reddy! ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght=400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff4d79;
      --yellow: #ffd700;
      --purple: #9d4edd;
      --blue: #f7aef8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #120813;
      color: white;
      overflow-x: hidden;
    }
    #hero {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    #bg-slideshow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease;
      filter: brightness(0.4);
    }
    .hero-content { position: relative; z-index: 2; padding: 2rem; }
    .birthday-tag {
      display: inline-block;
      background: var(--yellow);
      color: #1a0a00;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      margin-bottom: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hero-name {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: 1.1;
      background: linear-gradient(135deg, var(--pink), var(--yellow), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: rgba(255,255,255,0.85);
      font-weight: 600;
      margin-bottom: 2rem;
    }
    .hero-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.75rem 2rem;
      border-radius: 50px;
      border: none;
      </html>
